<header>

    <nav>

<script>
    const menu = document.querySelector(".menu");
    const nav = document.querySelector("nav");

    menu.addEventListener("click", function() {
        nav.classList.toggle("ativo");
    });

    const seta = document.querySelector(".seta-submenu");
    const submenu = document.querySelector(".submenu");

    seta.addEventListener("click", function() {
        submenu.classList.toggle("ativo");
        seta.classList.toggle("ativo");
    });

    const editarFiltros = document.querySelector(".editar-filtros");

    editarFiltros.addEventListener("click", function() {
        window.location.href = "filtros.html";
    });
</script>
